{% extends 'base.html' %}
{% block title %}Formulario de planta · Raíz Celeste{% endblock %}
{% block content %}
<section class="section" id="planta-form-app" data-id="{{ plant_id or '' }}" v-cloak><a href="/admin/plantas">← Volver a plantas</a><h1>{{ 'Editar planta' if plant_id else 'Agregar planta' }}</h1><p v-if="loading" role="status">Cargando…</p><p v-if="error" class="notice error" role="alert">${ error }</p><form v-if="!loading && ready" class="editor-form" @submit.prevent="guardar"><label>Nombre *<input v-model.trim="planta.nombre" required maxlength="100"></label><label>Nombre científico<input v-model.trim="planta.nombre_cientifico" maxlength="150"></label><label>Categoría *<select v-model.number="planta.categoria_id" required><option disabled value="">Elegí una categoría</option><option v-for="c in categorias" :key="c.id" :value="c.id">${ c.nombre }</option></select></label><label>Descripción *<textarea v-model.trim="planta.descripcion" required maxlength="5000" rows="4"></textarea></label><div class="form-pair"><label>Precio (ARS) *<input v-model.number="planta.precio" required type="number" min="0.01" max="99999999.99" step="0.01"></label><label>Stock *<input v-model.number="planta.stock" required type="number" min="0" max="2147483647" step="1"></label></div><label>Imagen: URL o ruta /static/img/<input v-model.trim="planta.imagen" maxlength="255" placeholder="/static/img/planta.svg"></label><label>Luz<input v-model.trim="planta.luz" maxlength="100"></label><label>Riego<input v-model.trim="planta.riego" maxlength="150"></label><label class="check"><input v-model="planta.destacada" type="checkbox"> Mostrar en destacadas</label><div class="actions"><button type="submit" :disabled="busy">${ busy ? 'Guardando…' : 'Guardar planta' }</button><a href="/admin/plantas">Cancelar</a></div></form></section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/admin.js') }}"></script>{% endblock %}
